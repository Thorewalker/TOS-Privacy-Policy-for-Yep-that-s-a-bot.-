<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yep, that's a bot.</title>

    <meta
        name="description"
        content="Terms of Service and Privacy Policy for the Discord bot Yep, that's a bot."
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;

            background: #1e1f22;
            color: #f2f3f5;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
        }

        .container {
            width: 100%;
            max-width: 700px;

            background: #2b2d31;
            border: 1px solid #3f4147;
            border-radius: 14px;

            padding: 42px;

            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 2.4rem;
        }

        .subtitle {
            color: #b5bac1;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .links {
            display: grid;
            gap: 14px;
        }

        .policy-link {
            display: block;
            padding: 18px 20px;

            background: #313338;
            border: 1px solid #44464d;
            border-radius: 10px;

            color: #ffffff;
            text-decoration: none;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease;
        }

        .policy-link:hover {
            background: #383a40;
            border-color: #5865f2;
            transform: translateY(-2px);
        }

        .policy-link strong {
            display: block;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .policy-link span {
            color: #b5bac1;
            font-size: 0.95rem;
        }

        footer {
            margin-top: 32px;

            color: #949ba4;
            font-size: 0.85rem;
            text-align: center;
        }

        @media (max-width: 600px) {
            .container {
                padding: 28px 22px;
            }

            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Yep, that's a bot.</h1>

        <p class="subtitle">
            Official legal information for the Discord application
            <strong>Yep, that's a bot.</strong>
        </p>

        <div class="links">

            <a class="policy-link" href="terms.html">
                <strong>Terms of Service</strong>
                <span>
                    Rules and conditions governing the use of Yep, that's a bot.
                </span>
            </a>

            <a class="policy-link" href="privacy.html">
                <strong>Privacy Policy</strong>
                <span>
                    Information about what data the bot accesses, stores, and uses.
                </span>
            </a>

        </div>

        <footer>
            Yep, that's a bot. &mdash; Discord Bot
        </footer>

    </main>

</body>
</html>
